<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bengali Flick Keyboard Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Prevent browser gestures/selection */
        body, html { overscroll-behavior: none; touch-action: none; height: 100%; margin: 0; font-family: 'Inter', sans-serif; }
        .keyboard-key { -webkit-tap-highlight-color: transparent; }
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans Bengali', sans-serif; }
        
        /* The Grid Layout: 5 Columns */
        #keyboard-container {
            display: grid;
            grid-template-columns: 1fr 1.25fr 1.25fr 1.25fr 1fr; /* Sidebars are smaller */
            gap: 6px;
            padding: 6px;
        }

        /* Flick Preview Popup */
        #flick-preview {
            position: absolute; display: none; 
            grid-template-areas: ". up ." "left base right" ". down .";
            width: 160px; height: 160px; pointer-events: none; z-index: 50;
        }
        .flick-cell { display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; background: rgba(255,255,255,0.9); border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .flick-cell.active { background: #3b82f6; color: white; transform: scale(1.1); }
        
        /* Grid Area Assignments */
        .area-up { grid-area: up; } .area-left { grid-area: left; } .area-right { grid-area: right; } .area-down { grid-area: down; } .area-base { grid-area: base; background: #e5e7eb; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 flex flex-col h-full">

    <div class="flex-1 p-4">
        <div id="text-display" class="w-full h-full bg-white dark:bg-gray-800 rounded-xl p-6 text-3xl shadow-inner border border-gray-200 dark:border-gray-700 whitespace-pre-wrap"></div>
    </div>

    <div id="flick-preview">
        <div class="flick-cell area-up"></div>
        <div class="flick-cell area-left"></div>
        <div class="flick-cell area-base"></div>
        <div class="flick-cell area-right"></div>
        <div class="flick-cell area-down"></div>
    </div>

    <div id="keyboard-container" class="bg-gray-200 dark:bg-gray-800 shadow-2xl pb-6">
        </div>

    <script>
        // --- 1. THE DATA (The Map) ---
        const keyMap = {
            'row1': [
                { key: '←', type: 'func', flicks: { base: 'cursorLeft' } },
                { key: 'ক', type: 'char', flicks: { base: 'ক', left: 'খ', up: 'গ', right: 'ঘ', down: 'ঙ' } },
                { key: 'চ', type: 'char', flicks: { base: 'চ', left: 'ছ', up: 'জ', right: 'ঝ', down: 'ঞ' } },
                { key: 'ট', type: 'char', flicks: { base: 'ট', left: 'ঠ', up: 'ড', right: 'ঢ', down: 'ণ' } },
                { key: '⌫', type: 'func', flicks: { base: 'backspace' } }
            ],
            'row2': [
                { key: '→', type: 'func', flicks: { base: 'cursorRight' } },
                { key: 'অ', type: 'char', flicks: { base: 'অ', left: 'ই', up: 'উ', right: 'এ', down: 'ও' } },
                { key: '্', type: 'char', flicks: { base: '্', left: 'ৎ', up: 'ং', right: 'ঃ', down: 'ঁ' } },
                { key: 'আ', type: 'char', flicks: { base: 'আ', left: 'ঈ', up: 'ঊ', right: 'ঐ', down: 'ঔ' } },
                { key: '␣', type: 'func', label: 'Space', flicks: { base: ' ' } }
            ],
            'row3': [
                { key: 'abc', type: 'func', flicks: { base: 'mode' } },
                { key: 'ত', type: 'char', flicks: { base: 'ত', left: 'থ', up: 'দ', right: 'ধ', down: 'ন' } },
                { key: 'প', type: 'char', flicks: { base: 'প', left: 'ফ', up: 'ব', right: 'ভ', down: 'ম' } },
                { key: 'য', type: 'char', flicks: { base: 'য', left: 'র', up: 'ল', right: 'য়', down: 'ঋ' } },
                { key: '⏎', type: 'func', flicks: { base: 'enter' } }
            ],
            'row4': [
                { key: '123', type: 'func', flicks: { base: 'num' } },
                { key: 'ক্ষ', type: 'char', flicks: { base: 'ক্ষ', left: 'ত্র', up: 'জ্ঞ', right: 'র্', down: null } },
                { key: 'হ', type: 'char', flicks: { base: 'হ', left: 'শ', up: 'ষ', right: 'স', down: '়' } },
                { key: '।', type: 'char', flicks: { base: '।', left: '.', up: '?', right: ',', down: '-' } },
                { key: '🌐', type: 'func', flicks: { base: 'globe' } }
            ]
        };

        const MAATRA_MAP = { 'অ':'', 'আ':'া', 'ই':'ি', 'ঈ':'ী', 'উ':'ু', 'ঊ':'ূ', 'ঋ':'ৃ', 'এ':'ে', 'ঐ':'ৈ', 'ও':'ো', 'ঔ':'ৌ' };
        
        // --- 2. RENDER ENGINE (Draws the keys) ---
        const container = document.getElementById('keyboard-container');
        const textDisplay = document.getElementById('text-display');
        const preview = document.getElementById('flick-preview');
        const previewCells = {
            up: preview.querySelector('.area-up'),
            down: preview.querySelector('.area-down'),
            left: preview.querySelector('.area-left'),
            right: preview.querySelector('.area-right'),
            base: preview.querySelector('.area-base')
        };

        function render() {
            container.innerHTML = '';
            const allKeys = [...keyMap.row1, ...keyMap.row2, ...keyMap.row3, ...keyMap.row4];

            allKeys.forEach(data => {
                const btn = document.createElement('div');
                // Base Styling
                btn.className = `keyboard-key relative h-14 rounded-lg flex items-center justify-center select-none transition-transform active:scale-95 ${
                    data.type === 'func' 
                    ? 'bg-gray-300 dark:bg-gray-700 text-gray-800 dark:text-gray-200 font-bold text-sm' 
                    : 'bg-white dark:bg-gray-600 text-gray-900 dark:text-white shadow-md text-2xl font-medium'
                }`;
                
                // Label
                const label = document.createElement('span');
                label.innerText = data.label || data.key;
                btn.appendChild(label);

                // Corner Hints (Only for Char keys)
                if (data.type === 'char') {
                    if (data.flicks.left) createHint(btn, data.flicks.left, 'left-1 top-1/2 -translate-y-1/2');
                    if (data.flicks.right) createHint(btn, data.flicks.right, 'right-1 top-1/2 -translate-y-1/2');
                    if (data.flicks.up) createHint(btn, data.flicks.up, 'top-0.5 left-1/2 -translate-x-1/2');
                    if (data.flicks.down) createHint(btn, data.flicks.down, 'bottom-0.5 left-1/2 -translate-x-1/2');
                }

                // Attach Physics
                attachTouch(btn, data);
                container.appendChild(btn);
            });
        }

        function createHint(parent, char, posClass) {
            const s = document.createElement('span');
            s.className = `absolute text-[10px] text-gray-400 dark:text-gray-300 ${posClass}`;
            s.innerText = char;
            parent.appendChild(s);
        }

        // --- 3. PHYSICS ENGINE (Touch Handling) ---
        let activeKey = null;
        let startX, startY;
        const THRESHOLD = 25;

        function attachTouch(el, data) {
            el.addEventListener('touchstart', e => {
                e.preventDefault();
                activeKey = data;
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                
                // Show preview only for char keys with flicks
                if (data.type === 'char') showPreview(el, data);
                el.style.backgroundColor = '#d1d5db'; // Press effect
            }, {passive: false});

            el.addEventListener('touchmove', e => {
                if (!activeKey) return;
                e.preventDefault();
                const touch = e.touches[0];
                const dx = touch.clientX - startX;
                const dy = touch.clientY - startY;
                const dir = getDirection(dx, dy);
                
                if (data.type === 'char') highlightPreview(dir);
            }, {passive: false});

            el.addEventListener('touchend', e => {
                if (!activeKey) return;
                e.preventDefault();
                const touch = e.changedTouches[0];
                const dx = touch.clientX - startX;
                const dy = touch.clientY - startY;
                const dir = getDirection(dx, dy);
                
                const char = data.flicks[dir] || data.flicks.base;
                handleInput(char);

                // Reset
                hidePreview();
                el.style.backgroundColor = ''; 
                activeKey = null;
            });
        }

        function getDirection(dx, dy) {
            if (Math.abs(dx) < THRESHOLD && Math.abs(dy) < THRESHOLD) return 'base';
            if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 'right' : 'left';
            return dy > 0 ? 'down' : 'up';
        }

        // --- 4. PREVIEW UI ---
        function showPreview(el, data) {
            const rect = el.getBoundingClientRect();
            preview.style.left = (rect.left + rect.width/2 - 80) + 'px';
            preview.style.top = (rect.top - 170) + 'px'; // Float above
            preview.style.display = 'grid';

            previewCells.base.innerText = data.flicks.base;
            previewCells.up.innerText = data.flicks.up || '';
            previewCells.left.innerText = data.flicks.left || '';
            previewCells.right.innerText = data.flicks.right || '';
            previewCells.down.innerText = data.flicks.down || '';
            
            highlightPreview('base');
        }

        function highlightPreview(dir) {
            Object.values(previewCells).forEach(c => c.classList.remove('active'));
            if (previewCells[dir] && previewCells[dir].innerText) previewCells[dir].classList.add('active');
        }

        function hidePreview() {
            preview.style.display = 'none';
        }

        // --- 5. LOGIC ENGINE (Typing) ---
        function handleInput(char) {
            if (!char) return;
            
            // Special Functions
            if (char === 'backspace') {
                textDisplay.innerText = textDisplay.innerText.slice(0, -1);
                return;
            }
            if (char === 'enter') {
                textDisplay.innerText += '\n';
                return;
            }
            if (char === ' ') {
                textDisplay.innerText += ' ';
                return;
            }
            if (['cursorLeft', 'cursorRight', 'mode', 'num', 'globe'].includes(char)) {
                console.log("Function not implemented yet:", char);
                return;
            }

            // Smart Vowel Switching
            const lastChar = textDisplay.innerText.slice(-1);
            if (MAATRA_MAP[char] !== undefined && isConsonant(lastChar)) {
                textDisplay.innerText += MAATRA_MAP[char];
            } else {
                textDisplay.innerText += char;
            }
        }

        function isConsonant(char) {
            if (!char) return false;
            const c = char.charCodeAt(0);
            // Bengali Consonant Range (approx)
            return (c >= 0x0995 && c <= 0x09B9) || (c >= 0x09DC && c <= 0x09DF);
        }

        // Boot up
        render();

    </script>
</body>
</html>
