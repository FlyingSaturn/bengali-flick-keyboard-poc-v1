<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bengali Flick Keyboard - Zen Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CORE SETUP */
        body, html { overscroll-behavior: none; touch-action: none; height: 100%; margin: 0; font-family: 'Inter', sans-serif; }
        .no-tap { -webkit-tap-highlight-color: transparent; }
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600&display=swap');
        body { font-family: 'Noto Sans Bengali', sans-serif; }
        
        /* 5-COLUMN GRID LAYOUT (Japanese Style) */
        /* Left Sidebar (0.8fr) | Main (1fr 1fr 1fr) | Right Sidebar (0.8fr) */
        #keyboard-container {
            display: grid;
            grid-template-columns: 0.8fr 1fr 1fr 1fr 0.8fr;
            grid-template-rows: repeat(4, 1fr);
            gap: 6px;
            padding: 8px;
            height: 100%;
        }

        /* FLICK PREVIEW (The Cross) */
        #flick-preview {
            position: absolute; display: none; 
            grid-template-areas: ". up ." "left base right" ". down .";
            grid-template-rows: 1fr 1fr 1fr;
            grid-template-columns: 1fr 1fr 1fr;
            width: 180px; height: 180px; pointer-events: none; z-index: 100;
            margin-left: -60px; /* Offset to center on touch */
            margin-top: -160px; /* Offset to float above */
        }
        .flick-cell { 
            display: flex; align-items: center; justify-content: center; 
            font-size: 1.8rem; font-weight: bold; 
            background: rgba(255,255,255, 0.95); 
            color: #1f2937;
            border-radius: 8px; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); 
            border: 1px solid #e5e7eb;
        }
        /* Highlight the active selection */
        .flick-cell.active { 
            background: #3b82f6; color: white; border-color: #2563eb; 
            transform: scale(1.1); transition: transform 0.1s;
        }
        
        .area-up { grid-area: up; } 
        .area-left { grid-area: left; } 
        .area-right { grid-area: right; } 
        .area-down { grid-area: down; } 
        .area-base { grid-area: base; background: #f3f4f6; color: #4b5563; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 flex flex-col h-full overflow-hidden">

    <div class="flex-1 p-4 w-full max-w-2xl mx-auto flex flex-col justify-end">
        <div id="text-display" class="w-full bg-white dark:bg-gray-800 rounded-xl p-6 text-4xl shadow-sm border border-gray-200 dark:border-gray-700 min-h-[120px] whitespace-pre-wrap leading-relaxed"></div>
        <div class="text-center text-gray-400 text-sm mt-4 mb-2">Flick to type • Tap center for base</div>
    </div>

    <div id="flick-preview">
        <div class="flick-cell area-up"></div>
        <div class="flick-cell area-left"></div>
        <div class="flick-cell area-base"></div>
        <div class="flick-cell area-right"></div>
        <div class="flick-cell area-down"></div>
    </div>

    <div class="bg-gray-200 dark:bg-gray-800 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] w-full">
        <div id="keyboard-container" class="w-full max-w-2xl mx-auto h-[320px]">
            </div>
    </div>

    <script>
        // --- CONFIG: The 5-Column Layout ---
        // Sidebars are integrated directly into the rows for perfect grid alignment.
        const keyMap = {
            'row1': [
                { key: '.', type: 'func', action: 'punct' }         // Right Col
                { key: 'ক', type: 'char', flicks: { base: 'ক', left: 'খ', up: 'গ', right: 'ঘ', down: 'ঙ' } },
                { key: 'চ', type: 'char', flicks: { base: 'চ', left: 'ছ', up: 'জ', right: 'ঝ', down: 'ঞ' } },
                { key: 'ট', type: 'char', flicks: { base: 'ট', left: 'ঠ', up: 'ড', right: 'ঢ', down: 'ণ' } },
                { key: '⌫', type: 'func', action: 'backspace' }     // Right Col
            ],
            'row2': [
                { key: '←', type: 'func', action: 'cursorLeft' },   // Left Col
                { key: 'অ', type: 'char', flicks: { base: 'অ', left: 'ই', up: 'উ', right: 'এ', down: 'ও' } },
                { key: '্', type: 'char', flicks: { base: '্', left: 'ৎ', up: 'ং', right: 'ঃ', down: 'ঁ' } },
                { key: 'আ', type: 'char', flicks: { base: 'আ', left: 'ঈ', up: 'ঊ', right: 'ঐ', down: 'ঔ' } },
                { key: '→', type: 'func', action: 'cursorRight' },  // Right Col
            ],
            'row3': [
                { key: '123', type: 'func', action: 'num' },        // Left Col
                { key: 'ত', type: 'char', flicks: { base: 'ত', left: 'থ', up: 'দ', right: 'ধ', down: 'ন' } },
                { key: 'প', type: 'char', flicks: { base: 'প', left: 'ফ', up: 'ব', right: 'ভ', down: 'ম' } },
                { key: 'য', type: 'char', flicks: { base: 'য', left: 'র', up: 'ল', right: 'য়', down: 'ঋ' } },
                { key: ' ', type: 'func', label: '␣', action: 'space' } // Right Col (Space)
            ],
            'row4': [
                { key: 'EN', type: 'func', action: 'lang' },        // Left Col
                { key: 'ক্ষ', type: 'char', flicks: { base: 'ক্ষ', left: 'ত্র', up: 'জ্ঞ', right: 'র্', down: null } },
                { key: 'হ', type: 'char', flicks: { base: 'হ', left: 'শ', up: 'ষ', right: 'স', down: '়' } },
                { key: '।', type: 'char', flicks: { base: '।', left: '.', up: '?', right: ',', down: '-' } },
                { key: '⏎', type: 'func', action: 'enter' }         // Right Col
                
            ]
        };

        const MAATRA_MAP = { 'অ':'', 'আ':'া', 'ই':'ি', 'ঈ':'ী', 'উ':'ু', 'ঊ':'ূ', 'ঋ':'ৃ', 'এ':'ে', 'ঐ':'ৈ', 'ও':'ো', 'ঔ':'ৌ' };

        // --- DOM ELEMENTS ---
        const container = document.getElementById('keyboard-container');
        const textDisplay = document.getElementById('text-display');
        const preview = document.getElementById('flick-preview');
        const pCells = {
            base: preview.querySelector('.area-base'),
            up: preview.querySelector('.area-up'),
            down: preview.querySelector('.area-down'),
            left: preview.querySelector('.area-left'),
            right: preview.querySelector('.area-right'),
        };

        // --- RENDER ENGINE ---
        function render() {
            container.innerHTML = '';
            const allKeys = [...keyMap.row1, ...keyMap.row2, ...keyMap.row3, ...keyMap.row4];

            allKeys.forEach(data => {
                const btn = document.createElement('div');
                
                // CLEAN STYLING
                if (data.type === 'func') {
                    // Sidebar Keys: Gray, smaller font
                    btn.className = 'no-tap relative rounded-lg flex items-center justify-center select-none bg-gray-300 dark:bg-gray-700 text-gray-700 dark:text-gray-300 font-bold text-lg active:bg-gray-400 transition-colors shadow-sm';
                } else {
                    // Main Keys: White, Large Font, CLEAN (No hints)
                    btn.className = 'no-tap relative rounded-lg flex items-center justify-center select-none bg-white dark:bg-gray-600 text-gray-900 dark:text-white text-3xl font-medium shadow-md active:bg-gray-100 transition-colors';
                }

                btn.innerText = data.label || data.key;
                
                // Attach Physics
                attachTouch(btn, data);
                container.appendChild(btn);
            });
        }

        // --- PHYSICS ENGINE ---
        let activeKey = null;
        let startX, startY;
        const THRESHOLD = 25;

        function attachTouch(el, data) {
            el.addEventListener('touchstart', e => {
                e.preventDefault();
                activeKey = data;
                const t = e.touches[0];
                startX = t.clientX;
                startY = t.clientY;
                el.style.transform = "scale(0.95)";

                if (data.type === 'char') {
                    showPreview(el, data);
                }
            }, {passive: false});

            el.addEventListener('touchmove', e => {
                if (!activeKey || data.type !== 'char') return;
                e.preventDefault();
                const t = e.touches[0];
                const dx = t.clientX - startX;
                const dy = t.clientY - startY;
                const dir = getDirection(dx, dy);
                highlightPreview(dir);
            }, {passive: false});

            el.addEventListener('touchend', e => {
                e.preventDefault();
                el.style.transform = "scale(1)";
                
                if (activeKey) {
                    if (activeKey.type === 'char') {
                        const t = e.changedTouches[0];
                        const dir = getDirection(t.clientX - startX, t.clientY - startY);
                        const char = activeKey.flicks[dir] || activeKey.flicks.base;
                        handleInput(char);
                    } else {
                        // Function key tap
                        handleInput(null, activeKey.action);
                    }
                }
                
                hidePreview();
                activeKey = null;
            });
        }

        function getDirection(dx, dy) {
            if (Math.abs(dx) < THRESHOLD && Math.abs(dy) < THRESHOLD) return 'base';
            if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 'right' : 'left';
            return dy > 0 ? 'down' : 'up';
        }

        // --- PREVIEW LOGIC ---
        function showPreview(el, data) {
            const rect = el.getBoundingClientRect();
            // Center the pop-up relative to the key
            preview.style.left = (rect.left + rect.width / 2) + 'px';
            preview.style.top = (rect.top) + 'px'; 
            preview.style.display = 'grid';

            // Fill content (This is where the user finally sees the hints)
            pCells.base.innerText = data.flicks.base;
            pCells.up.innerText = data.flicks.up || '';
            pCells.left.innerText = data.flicks.left || '';
            pCells.right.innerText = data.flicks.right || '';
            pCells.down.innerText = data.flicks.down || '';

            highlightPreview('base');
        }

        function highlightPreview(dir) {
            Object.values(pCells).forEach(c => c.classList.remove('active'));
            if (pCells[dir] && pCells[dir].innerText) pCells[dir].classList.add('active');
        }

        function hidePreview() {
            preview.style.display = 'none';
        }

        // --- INPUT LOGIC ---
        function handleInput(char, action) {
            // Function Keys
            if (action === 'backspace') return textDisplay.innerText = textDisplay.innerText.slice(0, -1);
            if (action === 'space') return textDisplay.innerText += ' ';
            if (action === 'enter') return textDisplay.innerText += '\n';
            if (action === 'punct') return textDisplay.innerText += '.';
            if (char) {
                // Smart Vowels
                const last = textDisplay.innerText.slice(-1);
                if (MAATRA_MAP[char] !== undefined && isConsonant(last)) {
                    textDisplay.innerText += MAATRA_MAP[char];
                } else {
                    textDisplay.innerText += char;
                }
            }
        }

        function isConsonant(char) {
            if (!char) return false;
            const c = char.charCodeAt(0);
            return (c >= 0x0995 && c <= 0x09B9) || (c >= 0x09DC && c <= 0x09DF);
        }

        render();
    </script>
</body>
</html>
